name: Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run Sprint 1 performance acceptance test
        run: python scripts/performance_test.py

  setup-smoke:
    name: Clean setup smoke test
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SECRET_KEY: ci-setup-smoke-not-for-production
      DATABASE_PATH: /tmp/esims-setup-smoke.sqlite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install documented dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize a fresh database
        run: flask --app app init-db
      - name: Create an administrator using documented CLI
        run: flask --app app create-admin --username ci-admin --email ci-admin@example.invalid --password SetupSmoke123!
      - name: Start Flask and verify health endpoint
        run: |
          flask --app app run --host 127.0.0.1 --port 5055 > "$RUNNER_TEMP/esims-flask.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5055/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/esims-flask.log"
          exit 1

  browser-acceptance:
    name: Stable browser acceptance (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chrome
            browser: chrome
          - name: Edge
            browser: edge
          - name: Firefox
            browser: firefox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and browser-test dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install browser system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libatk-bridge2.0-0t64 libdbus-glib-1-2 libgbm1 libgtk-3-0t64 libnss3 libxss1
      - name: Run vendor stable browser acceptance flow
        env:
          ESIMS_BROWSER: ${{ matrix.browser }}
          ESIMS_EVIDENCE_DIR: ${{ runner.temp }}/browser-evidence
        run: python scripts/browser_compatibility.py
      - name: Retain browser versions, screenshots and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser-evidence/
          if-no-files-found: warn
          retention-days: 30
